; Woo-ESC-Capston 펌웨어. [env:modem] = S7 모뎀, [env:terminal] = S8 노드(깨어 있는 모드), 둘 다 2026-11-04.
[platformio]
default_envs = native

[env]
build_flags = -std=c++17 -Wall -Wextra -I../lora_proto
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; src/ 는 [env:terminal]·[env:modem] 이 생기면 채워진다. 그때까지 pio check 대상은 lib/·test/.
; 벤더링한 서드파티 코드(lib/*_vendor/, lib/*/vendor/)는 아예 분석하지 않는다 — 업스트림 원본을
; 그대로 유지하는 것이 원칙이라 cppcheck 지적을 우리가 고칠 수 없다.
; .pre-commit-config.yaml 의 clang-format exclude 와 같은 범위다.
; 주의: 이 필터는 '컴파일 대상 소스'만 거른다. 헤더 온리 벤더 코드는 아래 check_flags 의
; suppress 가 담당한다 — 게이트 통과에 실제로 필요한 것은 그쪽이고, 이 줄은 벤더 .cpp 를
; 분석 대상에서 빼는 역할이다.
; lib/font_data/·lib/image_data/ 는 embed_fonts.py·embed_images.py 가 만든 바이트 배열(생성물)이라
; 분석 대상에서 뺀다.
check_src_filters = +<lib/> +<test/> -<.pio/> -<lib/*_vendor/> -<lib/*/vendor/> -<lib/font_data/> -<lib/image_data/>
check_skip_packages = yes
; cppcheck 가 ArduinoJson(서드파티) 의 매크로 전처리를 잘못 해석하는 알려진 오탐 — 우리 코드가 아님.
; vendor 억제: check_src_filters 는 컴파일 대상 '소스'만 걸러낸다. 벤더링한 헤더
; (lib/host_gfx/vendor/stb_image_write.h 는 헤더 온리 라이브러리)는 우리 .cpp 의 번역 단위에
; 딸려 들어가므로 필터로는 빠지지 않는다 — 파일 경로 기준 suppress 로 함께 막는다.
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective --suppress=*:*/vendor/* --suppress=*:*_vendor/*

; 호스트 테스트: codec · determineLayout · nextChangeAt · 렌더 프리뷰
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ignore = Adafruit BusIO, Adafruit GFX Library
; Adafruit GFX 는 Arduino.h/Print.h 를 요구해 native 플랫폼에선 라이브러리 매니저로 못 받는다(LDF가 배제,
; lib_compat_mode/lib_ignore 로 우회). 실제로 쓰는 4개 파일(Adafruit_GFX.h/.cpp, gfxfont.h, glcdfont.c)만
; lib/adafruit_gfx_vendor/ 에 벤더링하고 Arduino 심(WProgram.h 등)은 tools/arduino_shim/ 에 둔다.
; 심의 상세 근거는 docs/plans/2026-09-16-s3-render.md Task 1 참조.
; render_model.h 는 이제 firmware/lib/render_model/ 에 있어 LDF가 자동으로 찾는다 — 별도 -I 불필요
; (이슈 #34 — src/terminal→lib/ 이동으로 역방향 의존 해소, -Isrc/terminal 플래그 제거).
build_flags = ${env.build_flags} -DLC_NATIVE -Itools/arduino_shim
; 폰트 자산(dh-04 plan D2): 빌드 직전 src/fonts/*.bin(+.json) → lib/font_data/ C 배열 생성.
; 이미지 자산(dh-04 Task 3 Phase B): 빌드 직전 src/fonts/images/*.bin(+.json) → lib/image_data/ C 배열 생성.
; lib/ 밑이라 LDF 가 자동 링크한다. 생성물은 .gitignore 대상. 원본 .bin 은 tools/gen_fonts.py·gen_images.py 가 만든다.
; [env] 공통이 아니라 폰트를 쓰는 env 에만 둔다 — charset.txt 드리프트 검사 실패를 폰트를 안 쓰는
; env(이후 [env:modem])가 물려받지 않게(#73 리뷰). native_preview 는 extends 로 물려받는다.
; 이후 [env:terminal] 도 같은 두 줄을 넣는다.
extra_scripts =
    pre:tools/embed_fonts.py
    pre:tools/embed_images.py

; render_preview 실행파일 전용. pio test 가 아니라 pio run 으로 빌드한다.
; extends 로 [env:native] 의 platform·lib_*·build_flags 를 그대로 물려받는다(PlatformIO 6.2.0 에서 동작 확인).
; build_src_filter 경로가 ../tools/ 인 이유: 필터는 src_dir(=firmware/src) 기준 상대경로인데
; render_preview.cpp 는 main() 을 가져 pio test 링크에 섞이면 안 되므로 tools/ 에 있다(파일 구조 절 참조).
; src_dir 은 [platformio] 섹션 전용이라 env 에서 재정의할 수 없어 필터를 src_dir 밖으로 겨눈다.
; host_gfx·fixture_parse 는 lib/ 에 있어 LDF 가 include 를 보고 자동으로 링크한다 — 여기 나열하지 않는다.
[env:native_preview]
extends = env:native
build_src_filter = +<../tools/render_preview.cpp>

; S7 모뎀 펌웨어 — 모뎀Pi 에 USB 로 붙는 Heltec V3 (v2 §4, docs/plans/2026-11-04-s7-modem-firmware.md).
; 로직은 lib/modem_core(native 테스트), 여기 src/modem/ 은 RadioLib·Serial 어댑터만.
; 굽기: pio run -e modem → esptool merge_bin → 모뎀Pi 에서 uvx esptool write_flash 0x0 (모뎀Pi 서비스 정지 중에)
[env:modem]
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = +<modem/>
; 노드·호스트 전용 lib 는 링크하지 않는다(LDF 가 include 로 고르지만, 렌더·폰트 생성물은 명시적으로 뺀다).
lib_ignore = host_gfx, fixture_parse, adafruit_gfx_vendor, render, bitmap_font, bitmap_image, font_data, image_data, epd_colors, render_model
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.1.2

; S8 노드 펌웨어(ESP노드) — 깨어 있는 모드, USB 전원 시연용. 딥슬립·프로비저닝은 S9.
; 로직은 lib/node_core(native 테스트), 여기 src/terminal/ 은 RadioLib·LittleFS·GxEPD2 어댑터만.
; 정체성은 빌드 플래그로(프로비저닝 전까지). 기본 E301-1 은 src/terminal/main.cpp 의 #ifndef 기본값.
; 다른 방은 환경 변수로 넘겨 굽는다(ini 에 -D 를 두면 환경 변수가 덮지 못한다):
;   PLATFORMIO_BUILD_FLAGS="-DNODE_ROOM=803" pio run -e terminal -t upload --upload-port COM6
; 굽기: pio run -e terminal -t upload (노드 USB)
[env:terminal]
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = +<terminal/>
build_flags = ${env.build_flags}
lib_ignore = host_gfx, fixture_parse, adafruit_gfx_vendor, modem_core
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.1.2
    zinggjm/GxEPD2@1.6.2
extra_scripts =
    pre:tools/embed_fonts.py
    pre:tools/embed_images.py

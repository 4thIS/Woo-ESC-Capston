; Woo-ESC-Capston 펌웨어. [env:terminal](노드) 와 [env:modem] 은 S7·S8 에서 추가한다.
[platformio]
default_envs = native

[env]
build_flags = -std=c++17 -Wall -Wextra -I../lora_proto
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; src/ 는 [env:terminal]·[env:modem] 이 생기면 채워진다. 그때까지 pio check 대상은 lib/·test/.
check_src_filters = +<lib/> +<test/> -<.pio/>
check_skip_packages = yes
; cppcheck 가 ArduinoJson(서드파티) 의 매크로 전처리를 잘못 해석하는 알려진 오탐 — 우리 코드가 아님.
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective

; 호스트 테스트: codec · determineLayout · nextChangeAt · 렌더 프리뷰
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ignore = Adafruit BusIO, Adafruit GFX Library
; Adafruit GFX 는 Arduino.h/Print.h 를 요구해 native 플랫폼에선 라이브러리 매니저로 못 받는다(LDF가 배제,
; lib_compat_mode/lib_ignore 로 우회). 실제로 쓰는 4개 파일(Adafruit_GFX.h/.cpp, gfxfont.h, glcdfont.c)만
; lib/adafruit_gfx_vendor/ 에 벤더링하고 Arduino 심(WProgram.h 등)은 tools/arduino_shim/ 에 둔다.
; 심의 상세 근거는 docs/plans/2026-09-16-s3-render.md Task 1 참조.
; -Isrc/terminal: test/*/test_main.cpp 가 "render_model.h" 를 상대경로 없이 바로 include 하기 위한 경로
; (S3 plan Task 2 사전점검에서 실측 확인 — LDF가 test/ 밖의 src/ 를 자동으로 include 경로에 넣어주지 않는다).
; host_gfx.h·fixture_parse.h 는 firmware/lib/ 밑에 있어 LDF가 자동으로 찾는다 — 별도 -I 불필요
; (Task 3 실행 중 tools/ 배치가 링크 실패로 재현돼 lib/로 옮기며 이전의 bare -Itools 플래그는 제거함).
build_flags = ${env.build_flags} -DLC_NATIVE -Itools/arduino_shim -Isrc/terminal

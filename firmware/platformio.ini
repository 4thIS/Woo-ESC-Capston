; Woo-ESC-Capston 펌웨어. [env:terminal](노드) 와 [env:modem] 은 S7·S8 에서 추가한다.
[platformio]
default_envs = native

[env]
build_flags = -std=c++17 -Wall -Wextra -I../lora_proto
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; src/ 는 [env:terminal]·[env:modem] 이 생기면 채워진다. 그때까지 pio check 대상은 lib/·test/.
check_src_filters = +<lib/> +<test/> -<.pio/>
check_skip_packages = yes
; cppcheck 가 ArduinoJson(서드파티) 의 매크로 전처리를 잘못 해석하는 알려진 오탐 — 우리 코드가 아님.
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective

; 호스트 테스트: codec · determineLayout · nextChangeAt · 렌더 프리뷰
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -DLC_NATIVE

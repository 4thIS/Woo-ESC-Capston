[project]
name = "server"
version = "0.1.0"
description = "메인Pi 서버 — FastAPI + lora_service(outbox·버전·WS 허브)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "lora-proto",
  "pyjwt>=2.9",
]

[tool.uv.sources]
lora-proto = { path = "../lora_proto", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "websockets>=13",
    "ruff>=0.7",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

# GitHub Actions — 경로 기반 다층 게이트
# 원리: paths 필터로 바뀐 영역의 job만 실행한다. main 브랜치 보호에서 이 체크들을 "required"로 켠다.
#
# 계약(lora_proto/)이 바뀌면 proto·firmware·server·modempi 네 job이 함께 돈다.
# 프로토콜 상수의 C++ 헤더 ↔ Python 미러 일치 검사와 test_vectors.json 드리프트 검사는
# proto job(lora_proto의 check_mirror·pytest)이 담당한다. firmware의 native 유닛 테스트는
# 그 벡터로 C++ 쪽 인코딩/디코딩 라운드트립만 검증한다(v2 §10.1).
#
# 각 job은 그 영역의 프로젝트 매니페스트가 생기기 전까지 스스로 건너뛴다.
# 구현 단계 P1~P4에서 매니페스트가 커밋되면 자동으로 검증이 켜진다.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# dorny/paths-filter 는 pull_request 이벤트에서 변경 파일을 GitHub API로 조회한다.
# 리포 기본 GITHUB_TOKEN 이 읽기 전용(contents 만)이라 pull-requests: read 가 없으면
# "Resource not accessible by integration" 으로 changes job 이 실패한다.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ===== 어떤 영역이 바뀌었는지 판별 =====
  changes:
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      firmware: ${{ steps.filter.outputs.firmware }}
      server: ${{ steps.filter.outputs.server }}
      modempi: ${{ steps.filter.outputs.modempi }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proto:
              - 'lora_proto/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - 'lora_proto/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'lora_proto/**'
              - '.github/workflows/ci.yml'
            modempi:
              - 'modempi/**'
              - 'lora_proto/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'server/**'
              - 'lora_proto/**'
              - 'compose.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  # ===== proto: 프로토콜 계약 (Python 미러·codec·벡터 드리프트) =====
  proto:
    needs: changes
    if: ${{ needs.changes.outputs.proto == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lora_proto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: setup
        run: |
          pip install uv
          uv sync --frozen
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: header ↔ python mirror
        run: uv run python -m tools.check_mirror
      - name: test (벡터 드리프트 포함)
        run: uv run pytest -q

  # ===== firmware: PlatformIO (C++) =====
  firmware:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: 영역 준비 여부 확인
        id: manifest
        run: |
          if [ -f platformio.ini ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/platformio.ini 가 아직 없어 검증을 건너뜁니다 (구현 단계 P1~P3에서 추가)"
          fi
      - uses: actions/setup-python@v5
        if: steps.manifest.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: setup
        if: steps.manifest.outputs.ready == 'true'
        run: pip install --upgrade platformio
      - name: lint
        if: steps.manifest.outputs.ready == 'true'
        run: pio check --fail-on-defect medium --fail-on-defect high
      - name: format check
        if: steps.manifest.outputs.ready == 'true'
        # 리포 루트의 .clang-format 설정을 따른다 (P1에서 추가).
        # pre-commit이 고정한 버전(19.1.4)과 맞춰 로컬·CI 판정이 갈리지 않게 한다.
        #
        # 벤더링한 서드파티 코드는 업스트림 원본 그대로 두므로(diff 추적 목적) 우리 스타일과 달라
        # 반드시 걸린다 — .pre-commit-config.yaml 의 clang-format exclude 와 같은 범위를 제외한다.
        # 이 스텝은 working-directory 가 firmware 라 git ls-files 출력이 firmware/ 기준 상대경로다.
        # 따라서 pre-commit 쪽 정규식(^firmware/lib/...)이 아니라 ^lib/... 로 앵커해야 실제로 걸린다.
        run: |
          pip install clang-format==19.1.4
          # `|| true`: 전부 걸러져 결과가 비면 grep 이 exit 1 을 내고, Actions 의 `bash -e` 가
          # 아래 빈 목록 가드에 닿기도 전에 스텝을 실패시킨다.
          files=$(git ls-files '*.cpp' '*.h' '*.hpp' | grep -Ev '^lib/([^/]*_vendor|[^/]+/vendor)/' || true)
          if [ -n "$files" ]; then clang-format --dry-run --Werror $files; fi
      - name: test
        if: steps.manifest.outputs.ready == 'true'
        run: pio test -e native
      - name: build render_preview (native_preview)
        if: steps.manifest.outputs.ready == 'true'
        # render_preview.cpp 는 main() 을 가져 pio test 에 안 들어간다 — 컴파일 검증은 이 스텝만 (PR #23)
        run: pio run -e native_preview

  # ===== server: FastAPI (Python + uv) =====
  server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: 영역 준비 여부 확인
        id: manifest
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::server/pyproject.toml 이 아직 없어 검증을 건너뜁니다 (구현 단계 P4에서 추가)"
          fi
      - uses: actions/setup-python@v5
        if: steps.manifest.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: setup
        if: steps.manifest.outputs.ready == 'true'
        run: |
          pip install uv
          uv sync --frozen
      - name: lint
        if: steps.manifest.outputs.ready == 'true'
        run: uv run ruff check .
      - name: format check
        if: steps.manifest.outputs.ready == 'true'
        run: uv run ruff format --check .
      - name: test
        if: steps.manifest.outputs.ready == 'true'
        run: uv run pytest -q
    # DB가 필요해지면 서비스 컨테이너를 붙이고 DATABASE_URL을 주입한다:
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env: { POSTGRES_PASSWORD: ci_only }

  # ===== docker: 메인Pi 배포 이미지 (2026-09-23 팀 결정 — 메인Pi 서버는 Docker Compose) =====
  # amd64 로 compose 빌드·기동·헬스·API 스모크, 그리고 메인Pi 용 arm64 빌드(QEMU)까지.
  docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI 용 server/.env (S4a 필수 env — 랜덤 비밀, 콘솔 메일)
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "STUDENT_WEB_URL=http://localhost:5173"
            echo "MAIL_BACKEND=console"
            echo "DEBUG=1"
          } > server/.env
      - name: compose build (amd64)
        run: docker compose build
      - name: compose up → healthy
        run: |
          docker compose up -d
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' esc-server 2>/dev/null || true)
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "health=$s"
          [ "$s" = healthy ]
      - name: 스모크 — CLI 초기 설정 → 로그인 → 인증 API 쓰기
        run: |
          curl -fsS http://localhost:8000/api/health
          docker exec esc-server python -m app.cli create-school --name ci --net-id 75 --email-domain ci.example.com
          echo 'ci-password-1234' | docker exec -i esc-server python -m app.cli create-admin \
            --school-id 1 --email admin@ci.example.com --name CI
          T=$(curl -fsS -X POST http://localhost:8000/api/auth/login -H 'content-type: application/json' \
                -d '{"email":"admin@ci.example.com","password":"ci-password-1234"}' | jq -r .token)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/lora/modems)" = 401   # 토큰 없으면 거부
          curl -fsS -X POST http://localhost:8000/api/lora/modems -H "Authorization: Bearer $T" \
            -H 'content-type: application/json' -d '{"modem_id":"ci-smoke"}' > /dev/null
          curl -fsS http://localhost:8000/api/lora/modems -H "Authorization: Bearer $T" | grep -q ci-smoke
          test "$(docker exec esc-server id -u)" = 10001            # root 로 돌지 않는다
          docker exec esc-server sh -c 'test ! -e /app/server/.env'  # 비밀값이 이미지에 안 들어갔다
          if curl -sI http://localhost:8000/api/health | grep -qi '^server:'; then
            echo 'Server 헤더가 노출된다 (--no-server-header 누락)'; exit 1
          fi
      - name: 로그 (실패 시)
        if: failure()
        run: docker compose logs server
      - name: down
        if: always()
        run: docker compose down -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: arm64 빌드 (메인Pi)
        run: docker buildx build --platform linux/arm64 -f server/Dockerfile .

  # ===== modempi: 모뎀Pi 서비스 (Python + uv) =====
  modempi:
    needs: changes
    if: ${{ needs.changes.outputs.modempi == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modempi
    steps:
      - uses: actions/checkout@v4
      - name: 영역 준비 여부 확인
        id: manifest
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::modempi/pyproject.toml 이 아직 없어 검증을 건너뜁니다 (S5·S6에서 추가)"
          fi
      - uses: actions/setup-python@v5
        if: steps.manifest.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: setup
        if: steps.manifest.outputs.ready == 'true'
        run: |
          pip install uv
          uv sync --frozen
      - name: lint
        if: steps.manifest.outputs.ready == 'true'
        run: uv run ruff check .
      - name: format check
        if: steps.manifest.outputs.ready == 'true'
        run: uv run ruff format --check .
      - name: test
        if: steps.manifest.outputs.ready == 'true'
        run: uv run pytest -q

  # ===== web: Vue 3 (TypeScript + pnpm) =====
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: 영역 준비 여부 확인
        id: manifest
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json 이 아직 없어 검증을 건너뜁니다 (웹 세션 착수 시 추가)"
          fi
      - uses: actions/setup-node@v4
        if: steps.manifest.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: setup
        if: steps.manifest.outputs.ready == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: lint
        if: steps.manifest.outputs.ready == 'true'
        run: pnpm lint
      - name: format check
        if: steps.manifest.outputs.ready == 'true'
        run: |
          pnpm exec prettier --check .
          pnpm exec vue-tsc --build
      - name: test
        if: steps.manifest.outputs.ready == 'true'
        run: pnpm test
      - name: build
        if: steps.manifest.outputs.ready == 'true'
        run: pnpm build

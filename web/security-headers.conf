# 보안 헤더 — nginx.conf 의 server 와 add_header 가 있는 location 마다 include 한다.
# (location 에 add_header 가 하나라도 있으면 server 단 add_header 가 상속되지 않는다)
# 토큰이 sessionStorage 에 있으니 남의 스크립트가 돌 틈을 막는다 — 스크립트·스타일·폰트는 전부 자기 출처
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

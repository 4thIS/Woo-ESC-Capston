# 웹 컨테이너 — 학생(/)·관리자(/admin) 화면과 /api 프록시 (web/Dockerfile)
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # CSV 가져오기 상한은 서버가 1 MiB 로 판정한다(413 문장) — nginx 가 먼저 끊지 않게 여유를 둔다
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # server 컨테이너를 요청마다 다시 찾는다 — 서버를 다시 만들면 IP 가 바뀌는데,
    # 시작할 때 한 번만 찾으면 웹을 재시작할 때까지 502 가 난다. 서버가 없어도 웹은 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # 덮어쓴다(이어 붙이지 않는다) — 브라우저가 보낸 X-Forwarded-For 를 믿지 않는다.
        # 서버는 이 컨테이너가 준 값만 믿는다(compose.yaml FORWARDED_ALLOW_IPS) — 로그인 상한이 사람마다 걸린다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 파일 이름에 해시가 붙는다 — 내용이 바뀌면 이름이 바뀌니 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 앱 주소는 새로고침해도 그 앱으로 — html 은 캐시하지 않아 배포 뒤 바로 새 화면
    location /admin {
        try_files $uri /admin.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

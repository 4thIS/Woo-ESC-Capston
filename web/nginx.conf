# 웹 컨테이너 — 학생(/)·관리자(/admin) 화면과 /api 프록시 (web/Dockerfile)
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;

    # 공개 주소(Cloudflare 터널)로 온 요청은 메인Pi 의 cloudflared(--network host)가 localhost:80 으로 넘겨
    # 모두 docker 게이트웨이(172.30.250.1)에서 온 것으로 보인다 — 그대로 두면 로그인 IP 상한이 모두에게 한 개로 걸리고
    # 로그의 접속 IP 도 게이트웨이뿐이다. 그 주소에서 온 요청만 Cloudflare 가 붙인 실제 IP(CF-Connecting-IP)를 믿는다.
    # 집·학교 망에서 :80 으로 바로 온 요청은 원래 IP 그대로라 이 헤더를 믿지 않는다(브라우저가 꾸며 보내도 무시).
    # 게이트웨이는 compose.yaml esc 대역의 첫 주소 — 대역을 바꾸면 여기도 바꾼다
    set_real_ip_from 172.30.250.1;
    real_ip_header CF-Connecting-IP;

    # CSV 가져오기 상한은 서버가 1 MiB 로 판정한다(413 문장) — nginx 가 먼저 끊지 않게 여유를 둔다
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # server 컨테이너를 요청마다 다시 찾는다 — 서버를 다시 만들면 IP 가 바뀌는데,
    # 시작할 때 한 번만 찾으면 웹을 재시작할 때까지 502 가 난다. 서버가 없어도 웹은 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # 덮어쓴다(이어 붙이지 않는다) — 브라우저가 보낸 X-Forwarded-For 를 믿지 않는다.
        # 서버는 이 컨테이너가 준 값만 믿는다(compose.yaml FORWARDED_ALLOW_IPS) — 로그인 상한이 사람마다 걸린다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 파일 이름에 해시가 붙는다 — 내용이 바뀌면 이름이 바뀌니 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 앱 주소는 새로고침해도 그 앱으로 — html 은 캐시하지 않아 배포 뒤 바로 새 화면
    location /admin {
        try_files $uri /admin.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

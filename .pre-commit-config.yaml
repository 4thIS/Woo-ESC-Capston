# pre-commit — 커밋 순간의 로컬 게이트 (위생 + 보안)
# 설치: pip install pre-commit && pre-commit install
#
# 보안·위생 훅은 스택 무관하게 그대로 둔다. 언어별 포맷터만 영역별로 경로를 좁혀 건다.

repos:
  # ── 위생 (범용) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key      # 개인키 커밋 차단

  # ── 비밀정보 스캔 (범용, 강력 권장) ──────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── .env 커밋 차단 (범용) ────────────────────────────────
  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files from being committed
        entry: env files should not be committed
        language: fail
        files: '^(\.env|\.env\.local|\.env\..+\.local)$'

  # ── firmware: clang-format (C++) ─────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        files: '^firmware/.*\.(c|cc|cpp|h|hpp)$'

  # ── server · modempi: ruff (Python) ──────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: '^(server|modempi)/'
      - id: ruff-format
        files: '^(server|modempi)/'

  # ── web: prettier (TS/Vue/CSS) ───────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd web && pnpm exec prettier --write "$@"' --
        language: system
        files: '^web/.*\.(ts|tsx|js|jsx|vue|json|css|scss|md)$'

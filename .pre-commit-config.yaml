# pre-commit — 커밋 순간의 로컬 게이트 (위생 + 보안)
# 설치: pip install pre-commit && pre-commit install
#
# 보안·위생 훅은 스택 무관하게 그대로 둔다. 언어별 포맷터만 영역별로 경로를 좁혀 건다.

repos:
  # ── 위생 (범용) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key      # 개인키 커밋 차단

  # ── 비밀정보 스캔 (범용, 강력 권장) ──────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── .env 커밋 차단 (범용) ────────────────────────────────
  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files from being committed
        entry: env files should not be committed
        language: fail
        files: '^(\.env|\.env\.local|\.env\..+\.local)$'

  # ── firmware: clang-format (C++) ─────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        files: '^firmware/.*\.(c|cc|cpp|h|hpp)$'
        # 벤더링한 서드파티 코드는 업스트림 원본 그대로 유지한다(diff 추적 목적, S3 plan Task 1 참조).
        # 특정 디렉터리 하나가 아니라 모든 lib/*/vendor/ 및 lib/*_vendor/ 패턴을 일반적으로 제외한다 —
        # adafruit_gfx_vendor 하나만 제외했다가 host_gfx/vendor/stb_image_write.h가 재포맷된 사고가
        # 있었음(S3 plan Task 3).
        exclude: '^firmware/lib/([^/]*_vendor|[^/]+/vendor)/'

  # ── server · modempi: ruff (Python) ──────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # uv 잠금(server 0.16.7 / modempi·lora_proto 0.16.6)과 맞춘다 — 다르면 같은 코드가 다르게 포맷됨(PR #21)
    hooks:
      - id: ruff
        args: [--fix]
        files: '^(server|modempi|lora_proto|firmware/tools)/'
      - id: ruff-format
        files: '^(server|modempi|lora_proto|firmware/tools)/'

  # ── web: prettier (TS/Vue/CSS) ───────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        # web/ 스캐폴드(package.json) 전에는 건너뛴다 — CLAUDE.md 같은 .md 만 있어도 훅이 걸리기 때문
        entry: bash -c 'cd web && { [ -f package.json ] || exit 0; } && pnpm exec prettier --write "$@"' --
        language: system
        files: '^web/.*\.(ts|tsx|js|jsx|vue|json|css|scss|md)$'

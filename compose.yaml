# 메인Pi 배포 (2026-09-23 팀 결정: 메인Pi 서버는 Docker 로 돌린다).
# 모뎀Pi 는 Docker 를 쓰지 않는다 — USB 시리얼·timesyncd 상태에 직접 붙어야 해서 systemd 로 돈다
# (docs/guides/2026-09-23-pi-integration-cw10.md §8).
#
#   docker compose up -d --build     # 빌드 + 기동(백그라운드). 코드가 바뀌면 같은 명령
#   docker compose logs -f server    # 로그
#   docker compose down              # 정지 (데이터는 볼륨에 남는다)
#
# 처음 한 번: cp server/.env.example server/.env 후 값을 채운다(JWT_SECRET·STUDENT_WEB_URL·메일 — server/README.md).
#   그다음 학교·관리자 계정: docker compose exec server python -m app.cli create-school … / create-admin …
# 노트북에서도 같은 명령으로 메인Pi 와 똑같은 서버를 띄울 수 있다.
# /docs·/static(통신 확인 페이지)은 server/.env 에 DEBUG=1 일 때만 열린다(운영에서는 끈다).
name: woo-esc

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: woo-esc/server:local
    container_name: esc-server
    ports:
      - "8000:8000"
    env_file:
      - path: server/.env          # 비밀값(JWT_SECRET·SMTP) — 커밋 금지, 이미지에도 안 들어간다(.dockerignore)
        required: true             # 없으면 up 이 바로 실패한다(서버가 재시작만 반복하는 대신)
    environment:
      SERVER_DB: /data/main.db     # .env 의 SERVER_DB 보다 우선 — DB 는 항상 볼륨에
    volumes:
      - server-data:/data          # SQLite DB — 컨테이너를 지우고 다시 빌드해도 남는다
    restart: unless-stopped         # Pi 재부팅·크래시 뒤 자동 기동 (systemd 유닛 불필요)
    stop_grace_period: 10s

volumes:
  server-data:
